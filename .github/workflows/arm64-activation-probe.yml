name: ARM64 Activation Probe

# Temporary diagnostic workflow proving WHY the PSA print-support extension
# capability refresh times out on the GitHub-hosted ARM64 runner.
# Remove after diagnosis.

on:
  push:
    branches:
      - 'investigate/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  medium:
    name: ARM64 medium-integrity refresh test
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run capability refresh at genuine medium integrity
        shell: pwsh
        run: .\.github\probe-medium.ps1 -OutDir probe-out

      - name: Upload medium report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-medium-report
          path: probe-out/medium-report.json
          if-no-files-found: error
