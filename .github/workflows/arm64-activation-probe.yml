name: ARM64 Activation Probe

# Temporary diagnostic workflow: proves WHY the PSA print-support extension
# background task never activates on the GitHub-hosted ARM64 runner.
# Runs on push to the investigation branch only. Remove after diagnosis.

on:
  push:
    branches:
      - 'investigate/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: ARM64 activation environment probe
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 10
    steps:
      - name: Probe session, interactivity, background-app policy, and background-task activity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = [ordered]@{}

          # --- Session / interactivity (Session 0 / service vs interactive desktop) ---
          $out.processId = $PID
          $out.sessionId = (Get-Process -Id $PID).SessionId
          $out.userInteractive = [Environment]::UserInteractive
          $out.userName = [Environment]::UserName
          $out.machineName = [Environment]::MachineName
          $out.osVersion = [Environment]::OSVersion.VersionString
          $out.quser = (cmd /c quser 2>&1 | Out-String)
          $out.qwinsta = (cmd /c qwinsta 2>&1 | Out-String)
          $out.whoamiGroups = (cmd /c "whoami /groups" 2>&1 | Out-String)

          # --- Background-app policy gates (prime suspects for blocked activation) ---
          function Read-Key([string]$path) {
            try {
              if (Test-Path -LiteralPath $path) { return (Get-ItemProperty -LiteralPath $path | Select-Object * -ExcludeProperty PS*) }
              return '<missing>'
            } catch { return "err: $($_.Exception.Message)" }
          }
          $out.policy_AppPrivacy_HKLM = Read-Key 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
          $out.bg_HKCU_BackgroundAccessApplications = Read-Key 'HKCU:\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications'
          $out.bg_HKLM_BackgroundAccessApplications = Read-Key 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications'

          # --- Power / standby (Modern Standby can suppress background activation) ---
          $out.powercfgAvailability = (cmd /c "powercfg /a" 2>&1 | Out-String)

          # --- Is ANY background task activating system-wide? ---
          try {
            $log = Get-WinEvent -ListLog 'Microsoft-Windows-BackgroundTaskInfrastructure/Operational' -ErrorAction Stop
            $out.bgTaskLog = [ordered]@{ isEnabled = $log.IsEnabled; recordCount = $log.RecordCount }
            if ($log.RecordCount -gt 0) {
              $out.bgTaskRecent = @(Get-WinEvent -LogName 'Microsoft-Windows-BackgroundTaskInfrastructure/Operational' -MaxEvents 25 -ErrorAction SilentlyContinue |
                ForEach-Object { "$($_.TimeCreated.ToString('o')) [$($_.Id)] $($_.LevelDisplayName): $($_.Message)" })
            }
          } catch { $out.bgTaskLog = "err: $($_.Exception.Message)" }

          # --- Discover PSA / print-workflow operational logs available on this image ---
          $out.printRelatedLogs = @(Get-WinEvent -ListLog '*Print*' -ErrorAction SilentlyContinue |
            Select-Object LogName, IsEnabled, RecordCount, LogMode)

          # --- Print services + the session each runs in ---
          $out.printServices = @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'Spooler|PrintWorkflow|PrintNotify|PrintScan|PrintDevice|BrokerInfrastructure|AppReadiness|StateRepository|AppXSvc' } |
            ForEach-Object {
              $p = if ($_.ProcessId -gt 0) { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue } else { $null }
              [ordered]@{ name = $_.Name; state = $_.State; startMode = $_.StartMode; processId = $_.ProcessId; sessionId = if ($p) { $p.SessionId } else { $null } }
            })

          $json = $out | ConvertTo-Json -Depth 6
          $json | Out-File -FilePath probe.json -Encoding utf8
          Write-Host $json
          exit 0

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-activation-probe
          path: probe.json
          if-no-files-found: error

  repro:
    name: ARM64 capability-refresh reproduction
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reproduce capability refresh and capture activation evidence
        shell: pwsh
        run: .\.github\probe-activation.ps1 -OutDir probe-out

      - name: Upload activation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-activation-report
          path: probe-out/activation-report.json
          if-no-files-found: error

  integrity:
    name: ARM64 elevated-vs-medium integrity comparison
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compare capability refresh at high vs medium integrity
        shell: pwsh
        run: .\.github\probe-integrity.ps1 -OutDir probe-out

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-integrity-report
          path: probe-out/integrity-report.json
          if-no-files-found: error
