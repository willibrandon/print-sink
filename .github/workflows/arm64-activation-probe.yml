name: ARM64 Activation Probe

# Temporary diagnostic workflow proving WHY the PSA print-support extension
# capability refresh times out on the GitHub-hosted ARM64 runner.
# Remove after diagnosis.

on:
  push:
    branches:
      - 'investigate/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  medium:
    name: ARM64 medium-integrity refresh test
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run capability refresh as a separate normal-admin user
        shell: pwsh
        run: .\.github\probe-newuser.ps1 -OutDir probe-out

      - name: Upload newuser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-newuser-report
          path: probe-out/newuser-report.json
          if-no-files-found: error
