name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-test:
    name: ${{ matrix.platform }} build and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025-vs2026
          - platform: ARM64
            runner: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          msbuild -version

      - name: Restore
        shell: pwsh
        run: msbuild .\PrintSink.slnx /t:Restore /p:Configuration=Debug /p:Platform=${{ matrix.platform }} /nologo /v:minimal

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Configuration Debug -Platform ${{ matrix.platform }}

      - name: Test
        shell: pwsh
        run: dotnet test .\PrintSink.slnx --no-build -p:Platform=${{ matrix.platform }} --logger "trx;LogFileName=tests-${{ matrix.platform }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
