name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: ${{ matrix.platform }} build and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025-vs2026
          - platform: X86
            runner: windows-2025-vs2026
          - platform: ARM64
            runner: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          msbuild -version

      - name: Ensure packaged app test runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            $command = Get-Command vswhere.exe -ErrorAction SilentlyContinue
            if ($command) {
              $vswhere = $command.Source
            }
          }

          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'Could not find vswhere.exe.'
          }

          $installationPath = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installationPath) {
            throw 'Could not find a Visual Studio installation with MSBuild.'
          }

          $testPlatformPath = Join-Path $installationPath 'Common7\IDE\Extensions\TestPlatform'
          $vstest = Join-Path $testPlatformPath 'vstest.console.exe'
          $uwpProvider = Join-Path $testPlatformPath 'Microsoft.VisualStudio.UwpTestHostRuntimeProvider.Deployment.dll'

          if (-not ((Test-Path -LiteralPath $vstest) -and (Test-Path -LiteralPath $uwpProvider))) {
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path -LiteralPath $setup)) {
              throw 'Could not find Visual Studio Installer setup.exe.'
            }

            & $setup modify `
              --installPath $installationPath `
              --add Microsoft.VisualStudio.Component.TestTools.BuildTools `
              --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
              --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
              --quiet `
              --norestart `
              --nocache

            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "Visual Studio Installer failed with exit code $LASTEXITCODE."
            }
          }

          if (-not (Test-Path -LiteralPath $vstest)) {
            throw "Could not find vstest.console.exe at $vstest."
          }

          if (-not (Test-Path -LiteralPath $uwpProvider)) {
            throw "Could not find packaged app test provider at $uwpProvider."
          }

          "VSTEST_CONSOLE=$vstest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        shell: pwsh
        run: msbuild .\PrintSink.slnx /t:Restore /p:Configuration=Debug /p:Platform=${{ matrix.platform }} /nologo /v:minimal

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Configuration Debug -Platform ${{ matrix.platform }}

      - name: Test
        shell: pwsh
        run: .\test.ps1 -Configuration Debug -Platform ${{ matrix.platform }} -NoBuild

      - name: Packaged app tests
        shell: pwsh
        run: .\test-app.ps1 -Configuration Debug -Platform ${{ matrix.platform }} -NoBuild

      - name: Core coverage
        shell: pwsh
        run: .\test-coverage.ps1 -Configuration Debug -Platform ${{ matrix.platform }}

      - name: Create CI package certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=PrintSink' `
            -FriendlyName 'PrintSink CI package signing' `
            -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          New-Item -ItemType Directory -Force -Path artifacts\certificates | Out-Null
          $certificatePath = Join-Path $PWD 'artifacts\certificates\PrintSink.CI.cer'
          Export-Certificate -Cert $cert -FilePath $certificatePath | Out-Null
          Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
          "PRINTSINK_PACKAGE_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build signed MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path $PWD 'artifacts\appxpackages\${{ matrix.platform }}'
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null

          msbuild src\PrintSink.App\PrintSink.App.csproj `
            /t:Restore,Build `
            /p:Configuration=Debug `
            /p:Platform=${{ matrix.platform }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$env:PRINTSINK_PACKAGE_CERTIFICATE_THUMBPRINT `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$packageDirectory\" `
            /nologo `
            /v:minimal

      - name: Real print-stack E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem -LiteralPath 'artifacts\appxpackages\${{ matrix.platform }}' -Recurse -Filter '*.msix' |
            Sort-Object -Property LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $package) {
            throw 'Signed MSIX package was not produced.'
          }

          tests\e2e\Invoke-PrintSinkE2E.ps1 `
            -PackagePath $package.FullName `
            -OutputDirectory (Join-Path $PWD 'artifacts\e2e\${{ matrix.platform }}') `
            -Cleanup

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: artifacts/test-results/${{ matrix.platform }}/*.trx
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}
          path: artifacts/coverage/core.${{ matrix.platform }}.cobertura.xml
          if-no-files-found: ignore

      - name: Upload E2E outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-outputs-${{ matrix.platform }}
          path: artifacts/e2e/${{ matrix.platform }}
          if-no-files-found: ignore

      - name: Upload MSIX package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.platform }}
          path: artifacts/appxpackages/${{ matrix.platform }}
          if-no-files-found: ignore
