name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: ${{ matrix.platform }} build and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025-vs2026
          - platform: ARM64
            runner: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          msbuild -version

      - name: Restore
        shell: pwsh
        run: msbuild .\PrintSink.slnx /t:Restore /p:Configuration=Debug /p:Platform=${{ matrix.platform }} /nologo /v:minimal

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Configuration Debug -Platform ${{ matrix.platform }}

      - name: Test
        shell: pwsh
        run: .\test.ps1 -Configuration Debug -Platform ${{ matrix.platform }} -NoBuild

      - name: Packaged app tests
        shell: pwsh
        run: .\test-app.ps1 -Configuration Debug -Platform ${{ matrix.platform }} -NoBuild

      - name: Core coverage
        shell: pwsh
        run: .\test-coverage.ps1 -Configuration Debug -Platform ${{ matrix.platform }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: artifacts/test-results/${{ matrix.platform }}/*.trx
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}
          path: artifacts/coverage/core.${{ matrix.platform }}.cobertura.xml
          if-no-files-found: ignore
